# ============================================================
#  Perfil de pruebas "mysql": ejecuta el conjunto de pruebas QA
#  contra una instancia real de MySQL 8, en lugar de H2.
#
#  Uso:  ./mvnw test -DargLine="-Dspring.profiles.active=mysql"
#
#  Requiere una base de datos vacia llamada tiendagenerica_test.
#  Las tablas se crean y se destruyen en cada ejecucion.
# ============================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/tiendagenerica_test?useUnicode=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=create-drop
