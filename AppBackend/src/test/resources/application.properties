# Configuracion de pruebas: H2 en modo de compatibilidad MySQL.
# Permite ejecutar la totalidad del conjunto de pruebas QA sin depender
# de una instancia MySQL en ejecucion.
spring.datasource.url=jdbc:h2:mem:tiendagenerica;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jackson.property-naming-strategy=SNAKE_CASE
tienda.usuario-inicial.desactivar-al-crear-usuarios=true
tienda.reportes.enmascarar-password=true
