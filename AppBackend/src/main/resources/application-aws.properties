# ============================================================
#  Perfil "aws": despliegue sobre EC2 + RDS MySQL 8.4.
#
#  Uso:  java -jar appbackend.jar --spring.profiles.active=aws
#        (la unidad systemd appbackend.service lo activa con
#         SPRING_PROFILES_ACTIVE=aws en su EnvironmentFile)
#
#  Todos los valores sensibles llegan por variables de entorno,
#  pobladas desde SSM Parameter Store al arrancar la instancia.
#  Este archivo no contiene ninguna credencial.
# ============================================================

# DB_HOST no tiene valor por defecto a proposito. Comprobado: si la
# variable falta, la aplicacion no arranca y tampoco cae a localhost;
# el marcador queda sin sustituir y el arranque termina con
# "UnknownHostException: ${DB_HOST}", que nombra la variable que falta.
# La base de datos y el usuario de aplicacion los crea previamente el
# modulo de Terraform db-bootstrap, por eso aqui NO se usa
# createDatabaseIfNotExist: el usuario de la aplicacion no tiene ese
# privilegio.
#
# sslMode=REQUIRED obliga a cifrar la conexion con RDS: si el servidor no
# ofrece TLS, la conexion falla en lugar de continuar en claro. No se usa
# useSSL=true porque desde Connector/J 8 esa propiedad esta obsoleta y
# equivale a PREFERRED, que cae a texto plano sin avisar.
# REQUIRED cifra pero no valida el certificado del servidor; subir a
# VERIFY_CA exige instalar el paquete de CA de RDS en un truststore de la
# instancia (ver infra/terraform/README.md).
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:tiendagenerica}?characterEncoding=UTF-8&serverTimezone=UTC&sslMode=REQUIRED

# El esquema lo derivan las entidades JPA: el proyecto no tiene ni guiones
# DDL versionados ni herramienta de migracion (Flyway/Liquibase), de modo
# que "validate" abortaria el arranque contra una base recien creada.
# "update" crea las tablas en el primer arranque y despues solo agrega lo
# que falte; nunca elimina ni reescribe columnas existentes.
spring.jpa.hibernate.ddl-auto=update

# En produccion no se vuelca cada consulta al registro.
spring.jpa.show-sql=false
