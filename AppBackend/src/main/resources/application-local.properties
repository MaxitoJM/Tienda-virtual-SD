# ============================================================
#  Perfil "local": ejecucion sin MySQL, usando base de datos H2
#  en archivo. Util para probar la aplicacion completa cuando aun
#  no se dispone de la instancia MySQL o del contenedor Docker.
#
#  Uso:  java -jar appbackend.jar --spring.profiles.active=local
# ============================================================
spring.datasource.url=jdbc:h2:file:./datos-h2/tiendagenerica;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2
