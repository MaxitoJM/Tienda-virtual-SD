# ============================================================
#  Tienda Generica Virtual - Backend
#  Configuracion segun Parte 4 del documento de especificacion
# ============================================================
spring.application.name=AppBackend

# ---------- Base de datos MySQL 8.4 ----------
# Todo el acceso a datos se configura por variables de entorno. Los valores
# por defecto son los del entorno de desarrollo (docker compose / MySQL local);
# en AWS los define el EnvironmentFile poblado desde SSM Parameter Store.
#
# sslMode=PREFERRED (cifra si el servidor lo ofrece, si no continua en claro)
# es lo adecuado para desarrollo. El perfil "aws" lo eleva a REQUIRED.
# Sustituye a la propiedad useSSL, obsoleta e ignorada desde Connector/J 8.
spring.jpa.database=MYSQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tiendagenerica}?characterEncoding=UTF-8&serverTimezone=UTC&sslMode=PREFERRED&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin123}

# ---------- Puerto de escucha del backend ----------
server.port=${SERVER_PORT:5000}

# ---------- Formato JSON: snake_case, igual al contrato de la API ----------
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=always

# ---------- Carga de archivos CSV de productos ----------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------- Usuario inicial del sistema (Modulo de Login) ----------
tienda.usuario-inicial.cedula=1
tienda.usuario-inicial.nombre=Administrador Inicial
tienda.usuario-inicial.email=admininicial@tiendagenerica.com
tienda.usuario-inicial.usuario=admininicial
tienda.usuario-inicial.password=admin123456

# Si es true, el usuario admininicial se desactiva automaticamente cuando
# existe al menos un usuario adicional creado desde el modulo de usuarios.
tienda.usuario-inicial.desactivar-al-crear-usuarios=true

# Enmascara las contrasenas en el reporte de usuarios (buena practica de seguridad).
# Poner en false para reproducir literalmente el pantallazo del documento.
tienda.reportes.enmascarar-password=true
