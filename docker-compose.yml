# Entorno local completo de la Tienda Generica Virtual.
# Reproduce la arquitectura desplegada en AWS:
#   MySQL 8.4 (RDS) + backend Spring Boot + frontend WAR sobre Tomcat 9
#
# La version de MySQL se mantiene igual a la de RDS a proposito, para que
# el entorno local y el desplegado no difieran en el motor de base de datos.

services:

  mysql:
    image: mysql:8.4
    container_name: tienda-mysql
    # MySQL 8.4 elimino el complemento mysql_native_password y la opcion
    # --default-authentication-plugin, asi que no se define ninguna: el
    # servidor usa caching_sha2_password, que el conector 8.4.0 soporta.
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: tiendagenerica
    ports:
      - "3306:3306"
    volumes:
      - datos-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-padmin123"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./AppBackend
    container_name: tienda-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: tiendagenerica
      DB_USER: root
      DB_PASSWORD: admin123
      SERVER_PORT: 5000
    ports:
      - "5000:5000"

  frontend:
    build: ./AppFrontend
    container_name: tienda-frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "8080:8080"

volumes:
  datos-mysql:
