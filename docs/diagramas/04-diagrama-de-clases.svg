<text x="52" y="863" font-size="10.5" fill="#64748b">Se muestran las clases representativas de cada capa. Los módulos de clientes, proveedores y detalle de ventas siguen exactamente la misma estructura: un controlador</text>
<text x="52" y="878" font-size="10.5" fill="#64748b">que expone la API, un servicio que concentra las validaciones de negocio, un repositorio de Spring Data y una entidad JPA por cada tabla de la base de datos.</text>
