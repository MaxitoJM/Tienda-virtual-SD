<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" fill="#1f2937">Flujo de la Transacción de Venta</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Historias de usuario HU-015 a HU-020</text>

  <!-- actores -->
  <g font-size="12.5">
    <rect x="40"  y="84" width="150" height="34" rx="4" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="115" y="106" text-anchor="middle" fill="#111827">Usuario</text>
    <rect x="245" y="84" width="150" height="34" rx="4" fill="#eef2ff" stroke="#6366f1"/>
    <text x="320" y="106" text-anchor="middle" fill="#312e81">Frontend (JSP)</text>
    <rect x="450" y="84" width="150" height="34" rx="4" fill="#ecfdf5" stroke="#10b981"/>
    <text x="525" y="106" text-anchor="middle" fill="#064e3b">API REST</text>
    <rect x="655" y="84" width="150" height="34" rx="4" fill="#ecfdf5" stroke="#10b981"/>
    <text x="730" y="106" text-anchor="middle" fill="#064e3b">VentaServicio</text>
    <rect x="850" y="84" width="120" height="34" rx="4" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="910" y="106" text-anchor="middle" fill="#7c2d12">MySQL</text>
  </g>

  <!-- lineas de vida -->
  <g stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="115" y1="118" x2="115" y2="600"/>
    <line x1="320" y1="118" x2="320" y2="600"/>
    <line x1="525" y1="118" x2="525" y2="600"/>
    <line x1="730" y1="118" x2="730" y2="600"/>
    <line x1="910" y1="118" x2="910" y2="600"/>
  </g>

  <g stroke="#4b5563" stroke-width="1.5" font-size="11.5" fill="#374151">
    <!-- 1 consulta cliente -->
    <path d="M115 152 L316 152" marker-end="url(#a)"/>
    <text x="122" y="146">1. Digita la cédula del cliente</text>
    <path d="M320 176 L521 176" marker-end="url(#a)"/>
    <text x="330" y="170">GET /clientes/consultar/{cedula}</text>
    <path d="M525 200 L906 200" marker-end="url(#a)"/>
    <path d="M910 224 L529 224" marker-end="url(#a)" stroke-dasharray="4 3"/>
    <text x="560" y="218" fill="#6b7280">nombre del cliente</text>

    <!-- 2 consulta producto -->
    <path d="M115 268 L316 268" marker-end="url(#a)"/>
    <text x="122" y="262">2. Digita código y cantidad (hasta 3 productos)</text>
    <path d="M320 292 L521 292" marker-end="url(#a)"/>
    <text x="330" y="286">GET /productos/consultar/{codigo}</text>
    <path d="M525 316 L321 316" marker-end="url(#a)" stroke-dasharray="4 3"/>
    <text x="345" y="310" fill="#6b7280">nombre y precio de venta</text>
    <text x="330" y="340" fill="#4b5563">valor_total = cantidad × precio_venta</text>

    <!-- 3 confirmar -->
    <path d="M115 392 L316 392" marker-end="url(#a)"/>
    <text x="122" y="386">3. Pulsa Confirmar</text>
    <path d="M320 416 L521 416" marker-end="url(#a)"/>
    <text x="330" y="410">POST /Ventas/registrar</text>
    <path d="M525 440 L726 440" marker-end="url(#a)"/>
  </g>

  <!-- caja de calculo -->
  <rect x="620" y="452" width="230" height="86" rx="5" fill="#f0fdf4" stroke="#10b981"/>
  <text x="634" y="472" font-size="11.5" fill="#065f46">Valida cliente, usuario, cantidades</text>
  <text x="634" y="490" font-size="11.5" fill="#065f46">y el máximo de 3 productos</text>
  <text x="634" y="510" font-size="11.5" fill="#065f46">valor_venta = Σ valor_total</text>
  <text x="634" y="528" font-size="11.5" fill="#065f46">ivaventa = Σ (valor_total × iva/100)</text>

  <g stroke="#4b5563" stroke-width="1.5" font-size="11.5" fill="#374151">
    <path d="M730 556 L906 556" marker-end="url(#a)"/>
    <text x="736" y="550">INSERT ventas + detalle_ventas</text>
    <path d="M910 580 L119 580" marker-end="url(#a)" stroke-dasharray="4 3"/>
    <text x="200" y="574" fill="#6b7280">Consecutivo, Total Venta, Total IVA y Total con IVA</text>
  </g>

  <!-- nota transaccion -->
  <rect x="850" y="530" width="140" height="40" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-dasharray="3 2"/>
  <text x="920" y="546" text-anchor="middle" font-size="10.5" fill="#92400e">Una sola</text>
  <text x="920" y="560" text-anchor="middle" font-size="10.5" fill="#92400e">transacción</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L7,3.2 z" fill="#4b5563"/>
    </marker>
  </defs>
</svg>
