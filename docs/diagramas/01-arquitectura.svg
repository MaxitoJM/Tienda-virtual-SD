<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" font-size="22" fill="#1f2937">Arquitectura del Sistema</text>
  <text x="480" y="66" text-anchor="middle" font-size="13" fill="#6b7280">Tienda Genérica Virtual — dos aplicaciones desplegables por separado</text>

  <!-- Cliente -->
  <rect x="360" y="96" width="240" height="58" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="480" y="122" text-anchor="middle" font-size="15" fill="#111827">Navegador del usuario</text>
  <text x="480" y="141" text-anchor="middle" font-size="11.5" fill="#6b7280">HTML renderizado por el servidor</text>

  <path d="M480 154 L480 196" stroke="#6b7280" stroke-width="1.6" marker-end="url(#f)"/>
  <text x="492" y="178" font-size="11.5" fill="#4b5563">HTTP :8080</text>

  <!-- Frontend -->
  <rect x="230" y="196" width="500" height="102" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="252" y="222" font-size="16" fill="#312e81">AppFrontend</text>
  <text x="252" y="244" font-size="12.5" fill="#3730a3">Apache Tomcat 9 · ciclo3demo.war</text>
  <text x="252" y="264" font-size="12" fill="#4b5563">JSP + Servlets + JSTL · sesión de usuario · filtro de acceso</text>
  <text x="252" y="283" font-size="12" fill="#4b5563">ApiClient: consume la API por HTTP (URL configurable)</text>
  <rect x="612" y="212" width="98" height="26" rx="4" fill="#c7d2fe"/>
  <text x="661" y="230" text-anchor="middle" font-size="12" fill="#312e81">Puerto 8080</text>

  <path d="M480 298 L480 344" stroke="#6b7280" stroke-width="1.6" marker-end="url(#f)"/>
  <text x="492" y="318" font-size="11.5" fill="#4b5563">REST / JSON</text>
  <text x="492" y="334" font-size="11" fill="#9ca3af">snake_case</text>

  <!-- Backend -->
  <rect x="230" y="344" width="500" height="120" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="252" y="370" font-size="16" fill="#064e3b">AppBackend</text>
  <text x="252" y="392" font-size="12.5" fill="#065f46">Spring Boot 2.4.5 · Java 11 · appbackend.jar</text>
  <text x="252" y="412" font-size="12" fill="#4b5563">Controlador → Servicio → Repositorio (Spring Data JPA)</text>
  <text x="252" y="431" font-size="12" fill="#4b5563">Validaciones de negocio · BCrypt · transacciones</text>
  <text x="252" y="450" font-size="12" fill="#4b5563">Documentación de la API con Swagger UI</text>
  <rect x="612" y="360" width="98" height="26" rx="4" fill="#a7f3d0"/>
  <text x="661" y="378" text-anchor="middle" font-size="12" fill="#064e3b">Puerto 5000</text>

  <path d="M480 464 L480 508" stroke="#6b7280" stroke-width="1.6" marker-end="url(#f)"/>
  <text x="492" y="490" font-size="11.5" fill="#4b5563">JDBC</text>

  <!-- Base de datos -->
  <rect x="300" y="508" width="360" height="76" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="322" y="534" font-size="16" fill="#7c2d12">MySQL 8.0.24</text>
  <text x="322" y="555" font-size="12.5" fill="#92400e">Base de datos: tiendagenerica</text>
  <text x="322" y="574" font-size="12" fill="#4b5563">6 tablas · esquema generado por Hibernate</text>

  <!-- Equivalencia AWS -->
  <rect x="756" y="196" width="180" height="268" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="4 3"/>
  <text x="846" y="222" text-anchor="middle" font-size="13" fill="#374151">Despliegue en AWS</text>
  <line x1="772" y1="234" x2="920" y2="234" stroke="#e5e7eb"/>
  <text x="772" y="256" font-size="11.5" fill="#4b5563">Elastic Beanstalk</text>
  <text x="772" y="272" font-size="11.5" fill="#9ca3af">plataforma Tomcat</text>
  <text x="772" y="316" font-size="11.5" fill="#4b5563">Elastic Beanstalk</text>
  <text x="772" y="332" font-size="11.5" fill="#9ca3af">plataforma Java SE</text>
  <text x="772" y="404" font-size="11.5" fill="#4b5563">Amazon RDS</text>
  <text x="772" y="420" font-size="11.5" fill="#9ca3af">MySQL 8.0.24</text>
  <path d="M730 247 L756 247" stroke="#c4b5fd" stroke-width="1.4" stroke-dasharray="3 2"/>
  <path d="M730 395 L756 395" stroke="#6ee7b7" stroke-width="1.4" stroke-dasharray="3 2"/>
  <path d="M660 546 L740 546 L740 440 L756 440" fill="none" stroke="#fcd34d" stroke-width="1.4" stroke-dasharray="3 2"/>

  <defs>
    <marker id="f" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L7,3.2 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
